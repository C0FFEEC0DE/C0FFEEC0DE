name: UI tests (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This is a test-only workflow; it never deploys. The Pages deploy lives in
# deploy.yml. Cancel superseded runs to keep PR feedback fast.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build deps and build dist/
        run: |
          pip install --no-input pyyaml weasyprint pytest
          python -m pytest build/test_build.py -q
          python build/build.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install Playwright
        working-directory: tests/ui
        run: npm install --no-fund --no-audit

      - name: Install Chromium browser
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        working-directory: tests/ui
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui/playwright-report/
          retention-days: 14