    <rect x="0" y="18" width="4" height="4"/>
    <rect x="28" y="18" width="4" height="4"/>
    <rect x="2" y="22" width="4" height="4"/>
    <rect x="26" y="22" width="4" height="4"/>
    <rect x="6" y="26" width="4" height="4"/>
    <rect x="22" y="26" width="4" height="4"/>
    <rect x="10" y="28" width="4" height="4"/>
